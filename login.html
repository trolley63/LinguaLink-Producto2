
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acceso de usuarios a LinguaLink">
    <title>Login | LinguaLink</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                LinguaLink
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menú de navegación"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="intercambios.html">
                            Intercambios
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="usuarios.html">
                            Usuarios
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            href="login.html"
                            aria-current="page"
                        >
                            Login
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    <main class="container py-5">

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <header class="text-center mb-4">
                    <h1 class="h2">Bienvenido a LinguaLink</h1>

                    <p class="text-secondary">
                        Inicia sesión para acceder a tu cuenta.
                    </p>
                </header>

                <section class="card shadow-sm">

                    <div class="card-header bg-primary text-white py-3">
                        <h2 class="h5 mb-0">Iniciar sesión</h2>
                    </div>

                    <div class="card-body p-4">

                        <form id="formLogin">

                            <div class="mb-3">
                                <label for="emailLogin" class="form-label">
                                    Correo electrónico
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="emailLogin"
                                    name="email"
                                    placeholder="nombre@ejemplo.com"
                                    autocomplete="username"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="passwordLogin" class="form-label">
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="passwordLogin"
                                    name="password"
                                    placeholder="Introduce tu contraseña"
                                    autocomplete="current-password"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                                id="btnLogin"
                            >
                                Iniciar sesión
                            </button>

                        </form>

                        <div
                            id="mensajeLogin"
                            class="alert mt-3 mb-0 d-none"
                            role="alert"
                            aria-live="polite"
                        ></div>

                    </div>
                </section>

            </div>
        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="js/int_2_login.js"></script>

    <script type="module" src="js/navegacion.js"></script>
</body>
</html>
